name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - run: uv run --no-project python -m unittest discover -s tests -v

  release-please:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Opens/updates a release PR that bumps every plugin.json and CHANGELOG.md;
      # merging that PR tags vX.Y.Z and publishes the GitHub release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      # Approve and merge the release PR as the release app (a PR's author
      # can't approve it, and a merge by GITHUB_TOKEN wouldn't trigger the run
      # that tags and publishes the release).
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-pull-requests: write
          permission-contents: write
      - if: steps.release.outputs.prs_created == 'true'
        run: |
          author=$(gh pr view "$BRANCH" --json author -q .author.login)
          if [ "$author" != "app/github-actions" ]; then
            echo "::error::release PR opened by $author, not release-please; not merging"
            exit 1
          fi
          gh pr review "$BRANCH" --approve
          gh pr merge "$BRANCH" --squash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: release-please--branches--main
