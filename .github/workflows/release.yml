name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with ci.yaml.
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --no-project python -m unittest discover -s tests -v

  release-please:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Everything below runs as the release app: its PRs and merges trigger
      # workflows (GITHUB_TOKEN's don't), and it's the only author allowed to
      # auto-merge. Merging relies on the app being a ruleset bypass actor.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Opens/updates a release PR that bumps every plugin.json and CHANGELOG.md;
      # merging that PR tags vX.Y.Z and publishes the GitHub release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
      # Only merge if the PR was opened by this app and only bumps versions and
      # prepends to CHANGELOG.md. The merge is pinned to the commit checked.
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.release.outputs.prs_created == 'true'
        run: |
          read -r author sha < <(gh pr view "$BRANCH" --json author,headRefOid -q '"\(.author.login) \(.headRefOid)"')
          if [ "$author" != "app/$APP_SLUG" ]; then
            echo "::error::release PR opened by $author, not app/$APP_SLUG; not merging"
            exit 1
          fi
          git fetch --no-tags origin "$sha"
          python3 .github/scripts/check_release_pr.py origin/main "$sha"
          gh pr merge "$BRANCH" --squash --admin --match-head-commit "$sha"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: release-please--branches--main
