name: strip-connector-footer

# The Claude cloud GitHub connector appends a "Generated by" footer to PRs it
# opens, after the hook has already checked the body. Remove it on GitHub.
# pull_request_target runs the base branch's script, never the PR's, so a PR
# can't change what runs with write access.
on:
  pull_request_target:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  strip:
    if: contains(github.event.pull_request.body, 'claude.ai/code')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          printf '%s' "$BODY" | python3 .github/scripts/strip_connector_footer.py > "$RUNNER_TEMP/body.md"
          printf '%s' "$BODY" | cmp -s - "$RUNNER_TEMP/body.md" || gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
