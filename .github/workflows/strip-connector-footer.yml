name: strip-connector-footer

# The Claude cloud GitHub connector appends a "Generated by" footer to PRs it
# opens, after the hook has already checked the body. Remove it on GitHub.
# Plain pull_request, not pull_request_target: the connector pushes branches to
# this repo, and fork PRs (read-only token) are skipped instead of trusted.
on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  strip:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.body, 'claude.ai/code')
    runs-on: ubuntu-latest
    steps:
      # Only the exact footer at the very end goes. Bytes, not text mode, so a
      # CRLF body without the footer compares equal and isn't rewritten.
      - run: |
          printf '%s' "$BODY" | python3 -c '
          import re, sys
          body = sys.stdin.buffer.read().decode()
          footer = r"(?:\r?\n)*(?:---\r?\n)?_Generated by \[Claude Code\]\(https://claude\.ai/code[^)\s]*\)_\s*\Z"
          sys.stdout.buffer.write(re.sub(footer, "", body).encode())
          ' > "$RUNNER_TEMP/body.md"
          printf '%s' "$BODY" | cmp -s - "$RUNNER_TEMP/body.md" || gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
